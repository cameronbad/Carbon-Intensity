<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="example">time: actual(predicted) - index</div>
    <div id="intensity"></div>
    <div id="intensity_status"></div>
</body>
</html>
<script>
    async function loadIntensity(file, ID) {
        const response = await fetch(file);
        myDisplayer(await response.text(), ID);
    }
    function myDisplayer(text, ID) {
        const data = JSON.parse(text);
        
        const values = data.data;
        let time = (values.from).slice(11,16);
        document.getElementById(ID).innerHTML = time + "(UTC+0): " + values.intensity.actual +"("
        + values.intensity.forecast +")" + " - " + values.intensity.index;
        document.getElementById(ID + "_status").innerHTML = data.status;
    }
    loadIntensity("/api/carbon-intensity", "intensity"); 
    
</script>
